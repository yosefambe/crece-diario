<!DOCTYPE html>
<html>
<head><title>Generador de íconos</title></head>
<body style="background:#080C14;color:#fff;font-family:sans-serif;padding:20px">
<h2 style="color:#4DFFA0">Generador de íconos PWA — Crece Diario</h2>
<p>Haz clic en cada botón para descargar el ícono correspondiente.</p>
<br>
<canvas id="c192" width="192" height="192" style="border:1px solid #333;display:block;margin-bottom:10px"></canvas>
<button onclick="download('c192','icon-192.png')" style="padding:10px 20px;background:#4DFFA0;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-bottom:20px">⬇ Descargar icon-192.png</button>
<br>
<canvas id="c512" width="512" height="512" style="border:1px solid #333;display:block;margin-bottom:10px"></canvas>
<button onclick="download('c512','icon-512.png')" style="padding:10px 20px;background:#4DFFA0;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-bottom:20px">⬇ Descargar icon-512.png</button>

<script>
function drawIcon(canvas){
  const s=canvas.width, ctx=canvas.getContext('2d');
  const r=s*0.2;
  // Background rounded rect
  ctx.fillStyle='#080C14';
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(s-r,0);ctx.quadraticCurveTo(s,0,s,r);
  ctx.lineTo(s,s-r);ctx.quadraticCurveTo(s,s,s-r,s);
  ctx.lineTo(r,s);ctx.quadraticCurveTo(0,s,0,s-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();ctx.fill();
  // Glow
  const grd=ctx.createRadialGradient(s*.75,s*.2,0,s*.75,s*.2,s*.5);
  grd.addColorStop(0,'rgba(77,255,160,0.12)');grd.addColorStop(1,'rgba(77,255,160,0)');
  ctx.fillStyle=grd;ctx.fill();ctx.beginPath();ctx.arc(s*.75,s*.2,s*.5,0,Math.PI*2);ctx.fill();
  // CD text
  ctx.fillStyle='#4DFFA0';
  ctx.font=`900 ${s*.32}px Arial Black, sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('CD',s*.5,s*.38);
  // Lightning
  ctx.font=`${s*.22}px Arial`;
  ctx.fillText('⚡',s*.5,s*.65);
  // Bottom label
  ctx.fillStyle='rgba(77,255,160,0.65)';
  ctx.font=`700 ${s*.07}px Arial`;
  ctx.letterSpacing='3px';
  ctx.fillText('CRECE DIARIO',s*.5,s*.85);
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));

function download(id,name){
  const c=document.getElementById(id);
  const a=document.createElement('a');
  a.href=c.toDataURL('image/png');
  a.download=name;a.click();
}
</script>
</body>
</html>
