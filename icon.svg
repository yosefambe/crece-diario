<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#080C14"/>
  <!-- Glow effect -->
  <circle cx="380" cy="120" r="180" fill="#4DFFA0" fill-opacity="0.06"/>
  <!-- CD letters -->
  <text x="256" y="210" font-family="Arial Black, sans-serif" font-size="160" font-weight="900" fill="#4DFFA0" text-anchor="middle" letter-spacing="-8">CD</text>
  <!-- Lightning bolt -->
  <text x="256" y="360" font-family="Arial, sans-serif" font-size="100" text-anchor="middle">⚡</text>
  <!-- Bottom text -->
  <text x="256" y="430" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#4DFFA0" fill-opacity="0.7" text-anchor="middle" letter-spacing="6">CRECE DIARIO</text>
</svg>
